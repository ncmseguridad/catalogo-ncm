<style>
:root{
  --bg:#0a0a0a;
  --card:#141414;
  --card-2:#1b1b1b;
  --line:#262626;
  --line-hover:rgba(255,255,255,.32);
  --text:#ffffff;
  --soft:#e4e4e4;
  --muted:#b8b8b8;
  --wa:#25d366;
  --nav-h:84px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:96px;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-weight:400;
  line-height:1.65;
  padding-top:calc(var(--nav-h) + env(safe-area-inset-top,0px));
  -webkit-font-smoothing:antialiased;
  overflow-x:clip;
}
body.no-scroll{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font-family:inherit}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:8px}
.container{max-width:1160px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* === Navegación === */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:60;
  padding-top:env(safe-area-inset-top,0px);
  background:rgba(10,10,10,.82);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;
  transition:border-color .3s,background .3s;
}
.nav.sc{border-color:var(--line);background:rgba(10,10,10,.95)}
.nav-in{
  max-width:1160px;margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;gap:24px;min-height:var(--nav-h);
}
.logo{margin-right:auto;display:block}
.logo img{height:60px;width:auto}
.links{display:flex;gap:28px;align-items:center}
.links a{
  text-decoration:none;color:var(--muted);font-size:.9rem;font-weight:400;
  letter-spacing:.02em;position:relative;padding:6px 0;transition:color .25s;
}
.links a::after{
  content:"";position:absolute;left:0;bottom:0;height:1px;width:0;
  background:#fff;transition:width .3s;
}
.links a:hover{color:#fff}
.links a:hover::after{width:100%}
.nav-cta{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid rgba(37,211,102,.6);color:var(--wa);
  text-decoration:none;font-size:.88rem;font-weight:500;
  padding:10px 20px;border-radius:999px;transition:background .25s,color .25s;
}
.nav-cta:hover{background:var(--wa);color:#04210f}
.menu-btn{
  display:none;width:44px;height:44px;border:1px solid var(--line);
  border-radius:12px;background:transparent;cursor:pointer;
  flex-direction:column;align-items:center;justify-content:center;gap:5px;
}
.menu-btn span{width:20px;height:1.5px;background:#fff;transition:transform .25s,opacity .25s}
.menu-btn[aria-expanded=true] span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.menu-btn[aria-expanded=true] span:nth-child(2){opacity:0}
.menu-btn[aria-expanded=true] span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}

/* === Botones === */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:15px 28px;border-radius:999px;font-weight:500;font-size:.98rem;
  text-decoration:none;cursor:pointer;border:1px solid transparent;
  transition:transform .2s,box-shadow .3s,background .25s,border-color .25s;
}
.btn svg{width:20px;height:20px;flex:none}
.btn-light{background:#fff;color:#0a0a0a;border-color:#fff;font-weight:600}
.btn-light:hover{background:#ececec;transform:translateY(-2px)}
.btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35);font-weight:500}
.btn-ghost:hover{background:rgba(255,255,255,.08);border-color:#fff;transform:translateY(-2px)}
.btn-wa{
  background:linear-gradient(135deg,#2ee27a,#1da851);color:#04210f;font-weight:700;
  box-shadow:0 10px 30px rgba(37,211,102,.22);
}
.btn-wa:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(37,211,102,.35)}

/* === Hero === */
.hero{position:relative;text-align:center;padding:64px 0 48px;overflow:hidden}
.hero::before{
  content:"";position:absolute;left:50%;top:42%;width:860px;height:860px;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,255,255,.07),transparent 62%);
  pointer-events:none;
}
.hero .container{position:relative}
.eyebrow{
  display:inline-block;color:var(--soft);font-size:.74rem;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;
  padding:6px 14px;border:1px solid var(--line);border-radius:999px;
  background:rgba(255,255,255,.03);margin-bottom:24px;
}
h1{
  font-weight:600;font-size:clamp(2.15rem,5.8vw,4.1rem);line-height:1.08;
  letter-spacing:-.025em;max-width:880px;margin:0 auto 20px;text-wrap:balance;
}
h1 em{
  font-style:normal;
  background:linear-gradient(90deg,#ffffff,#bdbdc4);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.lead{color:var(--soft);font-size:clamp(.98rem,1.9vw,1.14rem);max-width:620px;margin:0 auto 30px}
.cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

.hero-strip{
  margin:44px auto 0;max-width:860px;
  display:grid;grid-template-columns:repeat(3,1fr);
  border:1px solid var(--line);border-radius:18px;
  background:rgba(20,20,20,.72);overflow:hidden;
}
.hero-strip>div{
  padding:18px 16px;text-align:center;border-right:1px solid var(--line);
}
.hero-strip>div:last-child{border-right:0}
.hero-strip b{display:block;color:#fff;font-size:.96rem;font-weight:600;margin-bottom:2px}
.hero-strip span{display:block;color:var(--muted);font-size:.82rem}

/* === Secciones === */
section.s{padding:56px 0}
.sh{max-width:640px;margin-bottom:28px}
h2{font-weight:600;font-size:clamp(1.55rem,3.4vw,2.15rem);line-height:1.15;letter-spacing:-.02em;margin-bottom:8px}
.sub{color:var(--muted);font-size:.96rem}

/* === Por qué elegirnos === */
.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.feat>div{
  padding:24px 22px;border:1px solid var(--line);border-radius:20px;
  background:linear-gradient(180deg,#151515,#101010);
  transition:border-color .25s,transform .25s;
}
.feat>div:hover{border-color:var(--line-hover);transform:translateY(-3px)}
.feat i{
  display:grid;place-items:center;width:42px;height:42px;
  border:1px solid rgba(255,255,255,.22);border-radius:12px;
  background:rgba(255,255,255,.04);margin-bottom:16px;color:#fff;
}
.feat svg{width:21px;height:21px}
.feat h3{font-size:1rem;font-weight:600;margin-bottom:6px;line-height:1.3}
.feat p{color:var(--muted);font-size:.88rem;line-height:1.55}

/* === Kits / Protección para tu hogar === */
.props{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.kit-card{
  display:flex;flex-direction:column;margin:0;
  border:1px solid var(--line);border-radius:20px;overflow:hidden;
  background:var(--card);transition:transform .3s,border-color .3s,box-shadow .3s;
}
.kit-card:hover{
  transform:translateY(-4px);border-color:var(--line-hover);
  box-shadow:0 20px 44px rgba(0,0,0,.45);
}
.kit-card .kimg{position:relative;aspect-ratio:4/3;background:#0e0e0e;overflow:hidden}
.kit-card img{width:100%;height:100%;object-fit:contain;transition:transform .5s}
.kit-card:hover img{transform:scale(1.03)}
.kit-card .ktag{
  position:absolute;left:12px;top:12px;
  background:rgba(10,10,10,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.24);color:#fff;
  font-size:.68rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  padding:5px 11px;border-radius:999px;
}
.kit-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.kit-body h3{font-size:1.12rem;font-weight:600;color:#fff}
.kit-body p{color:var(--muted);font-size:.88rem;line-height:1.5;flex:1}
.kit-btn{
  margin-top:8px;align-self:flex-start;
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 16px;border-radius:999px;
  border:1px solid rgba(255,255,255,.28);background:transparent;color:#fff;
  font-size:.85rem;font-weight:500;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s;
}
.kit-btn:hover{background:#fff;color:#0a0a0a;border-color:#fff}
.disc{margin-top:16px;font-size:.8rem;color:var(--muted)}

/* === Cómo trabajamos === */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{
  padding:26px 24px;border:1px solid var(--line);border-radius:20px;
  background:linear-gradient(180deg,#141414,#0f0f0f);
}
.step .n{
  font-size:1.9rem;font-weight:700;line-height:1;
  color:rgba(255,255,255,.26);margin-bottom:12px;letter-spacing:-.02em;
}
.step h3{font-size:1.04rem;font-weight:600;margin-bottom:6px;color:#fff}
.step p{color:var(--muted);font-size:.9rem;line-height:1.55}

/* === CTA Contacto === */
.cta{
  text-align:center;padding:64px 20px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:radial-gradient(ellipse at center,rgba(255,255,255,.06),transparent 65%);
}
.cta h2{max-width:680px;margin:0 auto 10px}
.cta p{color:var(--soft);margin-bottom:28px;font-size:1rem}
.cta .btn-wa{padding:16px 28px;font-size:1.02rem;white-space:nowrap}
.cta .btn-wa svg{width:24px;height:24px}
.pay-note{margin-top:18px;margin-bottom:0!important;font-size:.84rem!important;color:var(--muted)!important}

/* === Preguntas frecuentes === */
.faq{max-width:820px;display:grid;gap:12px}
.faq details{border:1px solid var(--line);border-radius:16px;background:var(--card);transition:border-color .25s}
.faq details[open]{border-color:var(--line-hover)}
.faq summary{
  list-style:none;cursor:pointer;padding:18px 22px;font-weight:500;font-size:.98rem;
  display:flex;justify-content:space-between;gap:16px;align-items:center;
}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:#fff;font-size:1.4rem;line-height:1;transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{padding:0 22px 20px;color:var(--muted);font-size:.93rem}

/* === Términos y Condiciones === */
details.acc{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;transition:border-color .25s;
}
details.acc[open]{border-color:var(--line-hover)}
details.acc>summary{
  list-style:none;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;gap:16px;padding:18px 22px;font-weight:500;font-size:.98rem;color:#fff;
}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";color:#fff;font-size:1.5rem;line-height:1;transition:transform .25s}
details.acc[open]>summary::after{transform:rotate(45deg)}
.legal-body{padding:4px 22px 26px;display:grid;gap:14px;color:#d6d6d6;font-size:.9rem;line-height:1.7}
.legal-body strong{color:#fff;font-weight:600}
.legal-body b{color:#fff;font-weight:500}
.legal-body ul{margin:8px 0 0 20px;display:grid;gap:6px}

/* === Dónde estamos === */
.donde{display:grid;grid-template-columns:1fr 1.35fr;gap:24px;align-items:stretch}
.donde-info{
  display:flex;flex-direction:column;gap:10px;justify-content:center;
  padding:26px;border:1px solid var(--line);border-radius:20px;background:var(--card);
  font-size:1rem;
}
.donde-info p{color:var(--soft)}
.donde-info b{color:#fff}
.donde-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.map-wrap{
  border-radius:20px;overflow:hidden;border:1px solid var(--line);
  background:#141414;min-height:260px;
}
.map-wrap iframe{
  width:100%;height:100%;min-height:260px;border:0;display:block;
  filter:grayscale(100%) invert(92%) contrast(90%) brightness(.95);
}

/* === Footer === */
footer{
  border-top:1px solid var(--line);
  padding:52px 20px calc(108px + env(safe-area-inset-bottom,0px));
  color:var(--muted);font-size:.9rem;
}
.fgrid{
  max-width:1160px;margin:0 auto;display:grid;
  grid-template-columns:1.2fr 1fr;gap:32px;align-items:start;
}
footer a{color:#fff;text-decoration:none;font-weight:400}
footer a:hover{text-decoration:underline;text-underline-offset:3px}
footer .fl img{height:50px;width:auto;margin-bottom:14px}
footer p+p{margin-top:6px}
.fc{list-style:none;display:flex;flex-direction:column;gap:12px}
.fc li{display:flex;align-items:center;gap:12px;word-break:break-word}
.fc svg{width:20px;height:20px;flex:none;color:#fff}
.copy{max-width:1160px;margin:28px auto 0;font-size:.82rem}

/* === Animación de entrada === */
.js .rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.js .rv.in{opacity:1;transform:none}

/* === Burbuja flotante limpia (sin onda verde) === */
.cw-btn{
  position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:74;
  width:60px;height:60px;padding:0;border:2px solid rgba(255,255,255,.85);border-radius:50%;
  background:#141414;cursor:pointer;overflow:hidden;
  display:grid;place-items:center;
  box-shadow:0 12px 30px rgba(0,0,0,.65);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .2s,background .2s,box-shadow .2s;
}
.cw-btn:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 16px 34px rgba(0,0,0,.75)}
.cw-btn .cw-img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:opacity .2s,transform .22s;
}
.cw-btn .cw-x{
  position:absolute;inset:0;display:grid;place-items:center;
  color:#fff;opacity:0;transform:rotate(-90deg) scale(.7);
  transition:opacity .2s,transform .22s;
}
.cw-btn .cw-x svg{width:24px;height:24px}
.cw-btn.menu-open{background:#1c1c20;border-color:rgba(255,255,255,.32)}
.cw-btn.menu-open .cw-img{opacity:0;transform:scale(.75)}
.cw-btn.menu-open .cw-x{opacity:1;transform:none}

/* Aviso inicial discreto */
.cw-hint{
  position:fixed;right:18px;
  bottom:calc(18px + 60px + 12px + env(safe-area-inset-bottom,0px));
  z-index:71;max-width:min(255px,calc(100vw - 96px));
  background:#18181c;color:#fff;border:1px solid rgba(255,255,255,.16);
  border-radius:16px 16px 6px 16px;
  padding:11px 32px 11px 14px;box-shadow:0 12px 30px rgba(0,0,0,.55);
  font-size:.88rem;line-height:1.35;
  opacity:0;transform:translateY(8px) scale(.97);visibility:hidden;
  transition:opacity .3s,transform .3s,visibility .3s;
}
.cw-hint.on{opacity:1;transform:none;visibility:visible}
.cw-hint-t{cursor:pointer;display:block}
.cw-hint-x{
  position:absolute;top:3px;right:3px;width:28px;height:28px;
  border:0;background:none;color:#999;font-size:1.2rem;cursor:pointer;border-radius:50%;
}
.cw-hint-x:hover{color:#fff}

/* === Menú desplegable mejorado (tarjeta unificada) === */
.cw-menu{
  position:fixed;right:18px;
  bottom:calc(18px + 60px + 14px + env(safe-area-inset-bottom,0px));
  z-index:73;
  width:min(300px,calc(100vw - 36px));
  background:rgba(20,20,24,.96);
  -webkit-backdrop-filter:blur(18px);backdrop
